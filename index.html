<!DOCTYPE html>
<html>
<head>
    <title>Super Mario</title>
    <style>
        body {
            background: #000;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        #screen {
            display: block;
            image-rendering: pixelated;
            width: min(100vw, 177.7778vh);
            height: min(100vh, 56.25vw);
            margin: auto;
            aspect-ratio: 16 / 9;
        }
    </style>
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <canvas id="screen" width="1280" height="720"></canvas>
</body>
</html>
